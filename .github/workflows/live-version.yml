name: Live version

on:
  push:
    branches: [main]
    paths-ignore:
      - version.json

permissions:
  contents: write

concurrency:
  group: live-version-main
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write deployed version
        run: |
          printf '{"sha":"%s","publishedAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json

      - name: Commit version marker
        run: |
          if git diff --quiet -- version.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: refresh live version"
          git push
