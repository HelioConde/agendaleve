name: Static QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check supabase-config.js
      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f README.md
          test -f FULLSTACK.md
          test -f MELHORIAS.md
          test -f package.json
          test -f playwright.config.js
          test -f tests/e2e.spec.js
          test -f sw.js
          test -f VALIDACAO_BETA.md
          test -f manifest.webmanifest
          test -f icon.svg
          test -f ads-config.js
          test -f ads.js
          test -f ADS_SETUP.md
          test -f supabase/functions/beta-summary/index.ts
          test -f supabase/functions/push-test/index.ts
          test -f supabase/functions/reminder-dispatch/index.ts
          test -f supabase/functions/beta-signal/index.ts
          test -f supabase/migrations/20261006083000_push_reminders_beta.sql
          test -f .github/workflows/e2e.yml
          test -f supabase/functions/create-booking/index.ts
          test -f supabase/functions/booking-availability/index.ts
          test -f supabase/functions/cancel-booking/index.ts
          test -f supabase/functions/booking-manage/index.ts
          test -f supabase/functions/reschedule-booking/index.ts
          test -f supabase/migrations/20261006024500_data_api_grants_and_indexes.sql
          test -f supabase/migrations/20261006025000_public_authenticated_rls.sql
          test -f supabase/migrations/20261006043000_booking_contact.sql
          test -f supabase/migrations/20261006050000_customer_cancellation.sql
          test -f supabase/migrations/20261006070000_customer_reschedule.sql
          test -f supabase/migrations/20261006074500_booking_no_show_status.sql
      - name: Check SEO and backend boot
        run: |
          grep -qi '<title' index.html
          grep -qi 'meta name="viewport"' index.html
          grep -qi 'meta name="description"' index.html
          grep -qi 'rel="canonical"' index.html
          grep -qi 'supabase-config.js' index.html
          grep -qi 'name="phone"' index.html
          grep -qi 'clientPhone' supabase/functions/create-booking/index.ts
          grep -qi 'booking-date-filter' index.html
          grep -qi 'data-booking-action' app.js
          grep -qi 'status-chip' style.css
          grep -qi 'cancelToken' supabase/functions/create-booking/index.ts
          grep -qi 'cancel_token_hash' supabase/functions/cancel-booking/index.ts
          grep -qi 'cancelBookingPanel' index.html
          grep -qi 'reschedule-date' index.html
          grep -qi 'booking-manage' app.js
          grep -qi 'reschedule-booking' app.js
          grep -qi 'excludedBookingId' supabase/functions/booking-availability/index.ts
          grep -qi 'booking-summary-service' index.html
          grep -qi 'updateBookingSummary' app.js
          grep -qi 'ownerDashboard' app.js
          grep -qi '2026-10 visual system refresh' style.css
          grep -qi -- '--accent: #1f6a4a' style.css
          grep -qi -- '--sand: #f1ece2' style.css
          grep -qi 'SoftwareApplication' index.html
          grep -qi 'setup-card' index.html
          grep -qi 'renderSetupProgress' app.js
          grep -qi 'formatPrice' app.js
          grep -qi 'maskPhoneInput' app.js
          grep -qi 'prefers-reduced-motion' style.css
          grep -qi 'booking-search' index.html
          grep -qi 'export-bookings' index.html
          grep -qi 'data-edit-service' app.js
          grep -qi 'no_show' app.js
          grep -qi 'exportBookingsCsv' app.js
          grep -qi 'weekly-hours' index.html
          grep -qi 'hoursByDay' app.js
          grep -qi 'hoursForDay' app.js
          grep -qi 'pushVapidPublicKey' supabase-config.js
          grep -qi 'serviceWorker' app.js
          grep -qi 'beta-signal' app.js
          grep -qi 'turnstileToken' app.js
          grep -qi 'turnstile_secret' supabase/functions/create-booking/index.ts
          grep -qi 'web-push' supabase/functions/reminder-dispatch/index.ts
          grep -qi 'notificationclick' sw.js
          grep -qi 'manifest.webmanifest' index.html
          grep -qi 'beforeinstallprompt' app.js
          grep -qi 'beta-summary' app.js
          grep -qi 'push-test' app.js
          grep -qi 'agendaleve-shell-v1' sw.js
          grep -qi 'ads-section' index.html
          grep -qi 'data-ad-placement="owner-footer"' index.html
          grep -qi 'data-ad-placement="public-footer"' index.html
          grep -qi 'AGENDALEVE_ADS' ads-config.js
          grep -qi 'pagead2.googlesyndication.com' ads.js
          grep -qi 'allowedPlacement' ads.js
          ! grep -qi 'R$ 19' index.html
          ! grep -qi 'R$ 39' index.html
