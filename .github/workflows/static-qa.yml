name: Static QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Check required files
        run: test -f index.html && test -f style.css && test -f README.md
      - name: Check basic HTML metadata
        run: |
          grep -qi '<title' index.html
          grep -qi 'meta name="viewport"' index.html
