name: Static QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check supabase-config.js
      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f README.md
          test -f FULLSTACK.md
          test -f supabase/functions/create-booking/index.ts
          test -f supabase/functions/booking-availability/index.ts
          test -f supabase/functions/cancel-booking/index.ts
          test -f supabase/functions/booking-manage/index.ts
          test -f supabase/functions/reschedule-booking/index.ts
          test -f supabase/migrations/20261006024500_data_api_grants_and_indexes.sql
          test -f supabase/migrations/20261006025000_public_authenticated_rls.sql
          test -f supabase/migrations/20261006043000_booking_contact.sql
          test -f supabase/migrations/20261006050000_customer_cancellation.sql
          test -f supabase/migrations/20261006070000_customer_reschedule.sql
      - name: Check SEO and backend boot
        run: |
          grep -qi '<title' index.html
          grep -qi 'meta name="viewport"' index.html
          grep -qi 'meta name="description"' index.html
          grep -qi 'rel="canonical"' index.html
          grep -qi 'supabase-config.js' index.html
          grep -qi 'name="phone"' index.html
          grep -qi 'clientPhone' supabase/functions/create-booking/index.ts
          grep -qi 'booking-date-filter' index.html
          grep -qi 'data-booking-action' app.js
          grep -qi 'status-chip' style.css
          grep -qi 'cancelToken' supabase/functions/create-booking/index.ts
          grep -qi 'cancel_token_hash' supabase/functions/cancel-booking/index.ts
          grep -qi 'cancelBookingPanel' index.html
          grep -qi 'reschedule-date' index.html
          grep -qi 'booking-manage' app.js
          grep -qi 'reschedule-booking' app.js
          grep -qi 'excludedBookingId' supabase/functions/booking-availability/index.ts
          grep -qi 'booking-summary-service' index.html
          grep -qi 'updateBookingSummary' app.js
          grep -qi 'ownerDashboard' app.js
